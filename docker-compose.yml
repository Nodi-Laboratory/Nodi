# Nodi 로컬 인프라 (D104: Supabase 스택 → 순수 Postgres + Qdrant)
#
# 실행: docker compose up -d
#   postgres  5433  데이터·권한(RLS)·비즈니스 함수
#   qdrant    6333  벡터 검색 (대시보드 http://localhost:6333/dashboard)
#
# 스키마는 db/ 의 파일이 이름순으로 자동 적용된다(공식 postgres 이미지의
# docker-entrypoint-initdb.d 규약) — **최초 1회, 빈 볼륨일 때만** 실행된다.
# 다시 적용하려면 볼륨을 지운다: docker compose down -v && docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodi
    ports:
      # 5433 — 로컬에 이미 도는 Postgres(5432)와 충돌하지 않게.
      - "5433:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - nodi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nodi"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333" # REST + 대시보드
      - "6334:6334" # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage

  # -------------------------------------------------------------------------
  # D115: 앱까지 컨테이너로 (서버 배포용)
  #
  # 아래 둘은 `profiles: [app]`이라 **기본 `docker compose up -d`로는 안 뜬다.**
  # 로컬 개발은 지금까지처럼 인프라만 컨테이너로 쓰고 백엔드·프론트는 호스트에서
  # 직접 돌린다(uv run / npm run dev) — 그 흐름을 바꾸지 않으려고 프로필로 뒀다.
  #
  #   로컬 개발: docker compose up -d                    (postgres + qdrant만)
  #   서버 배포: docker compose --profile app up -d --build  (전부)
  # -------------------------------------------------------------------------
  backend:
    profiles: ["app"]
    build:
      context: ./backend
    env_file:
      # UPSTAGE_API_KEY·JWT_SECRET 같은 비밀값은 공유하는 backend/.env에서 온다.
      # 없어도 기동은 된다(required: false) — 기본값으로 뜨고 /health/config가
      # 무엇이 비었는지 알려 준다.
      - path: ./backend/.env
        required: false
    environment:
      # env_file보다 우선한다. .env의 DSN은 호스트 기준(localhost:5433)이라
      # 컨테이너 안에서는 틀리다 — 서비스명·내부 포트로 덮어쓴다.
      DATABASE_URL: postgresql://nodi_app:nodi_app_dev@postgres:5432/nodi
      DATABASE_WORKER_URL: postgresql://nodi_worker:nodi_worker_dev@postgres:5432/nodi
      QDRANT_URL: http://qdrant:6333
      STORAGE_ROOT: /data/storage
    volumes:
      # 업로드 원본(D104-5). 컨테이너를 다시 만들어도 파일이 남아야 한다.
      - nodi_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    # 포트를 밖으로 열지 않는다 — 브라우저는 프론트(3000)만 보고, /api는
    # next.config.ts의 rewrite가 내부 네트워크로 넘긴다.
    expose:
      - "8000"

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        # 둘 다 **빌드 시점** 값이다. NEXT_PUBLIC_*는 번들에 박히고,
        # BACKEND_ORIGIN은 next.config.ts의 rewrites()가 빌드 때 평가돼
        # routes-manifest.json에 박힌다 — 런타임 환경변수로는 못 바꾼다.
        # `/api`는 "같은 출처로 보내라", BACKEND_ORIGIN은 그걸 넘길 내부 주소.
        NEXT_PUBLIC_API_BASE_URL: /api
        BACKEND_ORIGIN: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nodi_pgdata:
  nodi_storage:
