# Nodi 로컬 인프라 — Qdrant 벡터 저장소 (Supabase 옆, 임베딩 4096d/Cosine).
# 실행: docker compose up -d qdrant
# 대시보드: http://localhost:6333/dashboard
services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333" # REST + 대시보드
      - "6334:6334" # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
