# Nodi 로컬 인프라 (D104: Supabase 스택 → 순수 Postgres + Qdrant)
#
# **개발용이다.** 배포 서버는 컨테이너를 못 쓴다(D116) — 유일한 서버가
# CAP_SYS_ADMIN·CAP_NET_ADMIN이 바운딩 셋에서 빠진 샌드박스라 docker도
# rootless도 불가능하다. 서버 절차는 docs/DEPLOYMENT.md를 본다.
#
# 실행: docker compose up -d
#   postgres  5433  데이터·권한(RLS)·비즈니스 함수
#   qdrant    6333  벡터 검색 (대시보드 http://localhost:6333/dashboard)
#
# 백엔드·프론트는 컨테이너로 띄우지 않는다. 호스트에서 직접 돌린다:
#   backend   uv run uvicorn app.main:app --reload --port 8000
#   frontend  npm run dev
#
# 스키마는 db/ 의 파일이 이름순으로 자동 적용된다(공식 postgres 이미지의
# docker-entrypoint-initdb.d 규약) — **최초 1회, 빈 볼륨일 때만** 실행된다.
# 다시 적용하려면 볼륨을 지운다: docker compose down -v && docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodi
    ports:
      # 5433 — 로컬에 이미 도는 Postgres(5432)와 충돌하지 않게.
      - "5433:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - nodi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nodi"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333" # REST + 대시보드
      - "6334:6334" # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage

volumes:
  nodi_pgdata:
