<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 176" role="img" aria-label="노디 애벌레">
  <title>노디 애벌레</title>
  <defs>
    <!-- 몸통: 왼쪽 위가 밝고 오른쪽 아래로 갈수록 진해진다(시안의 광택). -->
    <radialGradient id="c-head" cx="34%" cy="24%" r="82%">
      <stop offset="0%" stop-color="#E9F7A8"/>
      <stop offset="45%" stop-color="#CDE95E"/>
      <stop offset="100%" stop-color="#A4CF27"/>
    </radialGradient>
    <radialGradient id="c-seg" cx="36%" cy="22%" r="86%">
      <stop offset="0%" stop-color="#DFF391"/>
      <stop offset="50%" stop-color="#C3E252"/>
      <stop offset="100%" stop-color="#9BC91F"/>
    </radialGradient>
    <linearGradient id="c-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B5DB3C"/>
      <stop offset="100%" stop-color="#8FBE18"/>
    </linearGradient>
    <radialGradient id="c-lens" cx="34%" cy="28%" r="76%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F7E6"/>
    </radialGradient>
    <radialGradient id="c-ball" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#E4F59C"/>
      <stop offset="100%" stop-color="#A8D22B"/>
    </radialGradient>
  </defs>

  <!-- 바닥 그림자 -->
  <ellipse cx="104" cy="158" rx="66" ry="8.5" fill="#A4CF27" opacity="0.16"/>

  <!--
    더듬이. 시안에서 이 캐릭터를 가장 먼저 알아보게 하는 것이 **끝의
    동그라미**라, 대는 가늘게 두고 공을 크게 잡는다.
  -->
  <g fill="none" stroke="#9ACB22" stroke-width="4" stroke-linecap="round">
    <path d="M74 52 q-9 -22 -12 -32"/>
    <path d="M100 48 q3 -22 12 -32"/>
  </g>
  <circle cx="60" cy="17" r="9" fill="url(#c-ball)"/>
  <circle cx="114" cy="15" r="9" fill="url(#c-ball)"/>

  <!--
    몸통. 시안은 머리가 **왼쪽 위**, 마디가 오른쪽 아래로 흐르며 끝이 살짝
    들린다. 뒤 마디부터 그려 앞이 위로 겹치게 한다.
  -->
  <g>
    <!-- 꼬리 -->
    <path d="M168 130 q14 -4 14 8 t-14 8 z" fill="url(#c-ring)"/>
    <ellipse cx="156" cy="134" rx="17" ry="15" fill="url(#c-seg)"/>
    <ellipse cx="147" cy="134" rx="6" ry="15" fill="url(#c-ring)" opacity="0.85"/>
    <ellipse cx="131" cy="132" rx="20" ry="18" fill="url(#c-seg)"/>
    <ellipse cx="119" cy="131" rx="6.5" ry="18" fill="url(#c-ring)" opacity="0.85"/>
    <ellipse cx="102" cy="128" rx="24" ry="21" fill="url(#c-seg)"/>
  </g>

  <!-- 머리 — 몸통보다 크고 둥글다. -->
  <circle cx="70" cy="98" r="44" fill="url(#c-head)"/>

  <!--
    안경. 시안의 인상은 **테가 매우 굵고 알이 크다**는 것이라 여기서
    가늘게 그리면 다른 캐릭터가 된다.
  -->
  <path d="M60 88 q11 -6 22 0" fill="none" stroke="#171712" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M31 94 q-8 -3 -11 -10" fill="none" stroke="#171712" stroke-width="4" stroke-linecap="round"/>
  <circle cx="47" cy="94" r="21" fill="url(#c-lens)" stroke="#171712" stroke-width="6"/>
  <circle cx="95" cy="92" r="20" fill="url(#c-lens)" stroke="#171712" stroke-width="6"/>

  <!-- 눈 — 오른쪽(글을 읽는 쪽)을 본다. -->
  <circle cx="53" cy="94" r="12" fill="#141410"/>
  <circle cx="100" cy="92" r="11.5" fill="#141410"/>
  <circle cx="57.5" cy="89" r="3.6" fill="#FFFFFF"/>
  <circle cx="104" cy="87" r="3.4" fill="#FFFFFF"/>
</svg>
