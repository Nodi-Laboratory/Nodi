[project]
name = "nodi-backend"
version = "0.1.0"
description = "nodi backend — FastAPI + Supabase (Stage 0 foundation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "qdrant-client>=1.10",
    "supabase>=2.6",
    "google-genai>=0.3",
    "apscheduler>=3.10",
    "python-ulid>=2.2",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Offline only: SVG art library generation (backend/scripts/generate_art.py).
art = [
    "anthropic>=0.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
